services:
  - type: web
    name: ia-crypto-trader-m1
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/state
    envVars:
      - key: PAPER_MODE
        value: "true"
      - key: SYMBOLS
        value: BTCUSDT,ETHUSDT,SOLUSDT,XRPUSDT
      - key: STARTING_CAPITAL
        value: "1000"
      - key: RISK_PCT
        value: "2"
